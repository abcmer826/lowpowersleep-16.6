name: Build LowPowerSleep iOS 16.6

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  rootless:
    name: Build Rootless
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (Rootless)
        shell: bash
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          "$THEOS/bin/install-sdk" 16.5
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build Rootless package
        working-directory: LowPowerSleep
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 DEBUG=0
          mkdir -p ../artifacts/rootless
          cp packages/*.deb ../artifacts/rootless/LowPowerSleep-0.0.1-rootless-iOS16.deb

      - name: Upload Rootless DEB
        uses: actions/upload-artifact@v4
        with:
          name: LowPowerSleep-0.0.1-rootless-iOS16
          path: artifacts/rootless/*.deb

  roothide:
    name: Build Roothide
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install roothide/Theos
        shell: bash
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          "$THEOS/bin/install-sdk" 16.5
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build Roothide package
        working-directory: LowPowerSleep
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 DEBUG=0
          mkdir -p ../artifacts/roothide
          cp packages/*.deb ../artifacts/roothide/LowPowerSleep-0.0.1-roothide-iOS16.deb

      - name: Upload Roothide DEB
        uses: actions/upload-artifact@v4
        with:
          name: LowPowerSleep-0.0.1-roothide-iOS16
          path: artifacts/roothide/*.deb
