name: Build LowPowerSleep iOS 16.6

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  rootless:
    name: Build Rootless
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos, Linux iOS toolchain and iOS SDK
        shell: bash
        run: |
          set -e
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          # The installer handles the Linux iOS clang/ld toolchain and patched SDKs.
          # CI=1 disables interactive prompts and selects the non-Swift toolchain.
          CI=1 bash "$THEOS/bin/install-theos"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "Installed SDKs:"
          ls -1 "$THEOS/sdks"
          echo "Toolchain:"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

      - name: Build Rootless package
        working-directory: LowPowerSleep
        run: |
          set -e
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 DEBUG=0
          mkdir -p ../artifacts/rootless
          cp packages/*.deb ../artifacts/rootless/LowPowerSleep-0.0.1-rootless-iOS16.deb

      - name: Upload Rootless DEB
        uses: actions/upload-artifact@v4
        with:
          name: LowPowerSleep-0.0.1-rootless-iOS16
          path: artifacts/rootless/*.deb

  roothide:
    name: Build Roothide
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install roothide/Theos, Linux iOS toolchain and iOS SDK
        shell: bash
        run: |
          set -e
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          # roothide/Theos keeps the standard Theos Linux toolchain layout.
          # Its installer installs the arm64/arm64e-capable iOS toolchain and SDKs.
          CI=1 bash "$THEOS/bin/install-theos"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "Installed SDKs:"
          ls -1 "$THEOS/sdks"
          echo "Toolchain:"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

      - name: Build Roothide package
        working-directory: LowPowerSleep
        run: |
          set -e
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 DEBUG=0
          mkdir -p ../artifacts/roothide
          cp packages/*.deb ../artifacts/roothide/LowPowerSleep-0.0.1-roothide-iOS16.deb

      - name: Upload Roothide DEB
        uses: actions/upload-artifact@v4
        with:
          name: LowPowerSleep-0.0.1-roothide-iOS16
          path: artifacts/roothide/*.deb
