name: Build LowPowerSleep iOS 16.6

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  rootless:
    name: Build Rootless
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and iOS 16.5 SDK
        shell: bash
        run: |
          set -e
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fL --retry 3 https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/iPhoneOS16.5.sdk.tar.xz
          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "Installed SDKs:"
          ls -1 "$THEOS/sdks"

      - name: Build Rootless package
        working-directory: LowPowerSleep
        run: |
          set -e
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 DEBUG=0
          mkdir -p ../artifacts/rootless
          cp packages/*.deb ../artifacts/rootless/LowPowerSleep-0.0.1-rootless-iOS16.deb

      - name: Upload Rootless DEB
        uses: actions/upload-artifact@v4
        with:
          name: LowPowerSleep-0.0.1-rootless-iOS16
          path: artifacts/rootless/*.deb

  roothide:
    name: Build Roothide
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install roothide/Theos and iOS 16.5 SDK
        shell: bash
        run: |
          set -e
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fL --retry 3 https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/iPhoneOS16.5.sdk.tar.xz
          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "Installed SDKs:"
          ls -1 "$THEOS/sdks"

      - name: Build Roothide package
        working-directory: LowPowerSleep
        run: |
          set -e
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 DEBUG=0
          mkdir -p ../artifacts/roothide
          cp packages/*.deb ../artifacts/roothide/LowPowerSleep-0.0.1-roothide-iOS16.deb

      - name: Upload Roothide DEB
        uses: actions/upload-artifact@v4
        with:
          name: LowPowerSleep-0.0.1-roothide-iOS16
          path: artifacts/roothide/*.deb
